<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyxColor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Roboto&family=Open+Sans&family=Montserrat&family=Lato&family=Oswald&family=Raleway&family=Nunito&family=Quicksand&family=Playfair+Display&family=Merriweather&family=Josefin+Sans&family=Pacifico&family=Lobster&family=Dancing+Script&family=Bangers&family=Fredoka+One&family=Righteous&family=Bebas+Neue&family=Cinzel&family=Cormorant&family=Amiri&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;transition:all .6s ease;overflow:hidden;position:relative;background:radial-gradient(ellipse at 70% 80%,#0a2a0a,#051505,#000800);background-attachment:fixed}
        #particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
        .app{width:100%;max-width:1100px;border-radius:28px;padding:28px;position:relative;z-index:1;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);box-shadow:0 30px 80px rgba(0,0,0,0.5);max-height:95vh;overflow-y:auto}
        .app::-webkit-scrollbar{width:6px}
        .app::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.05);border-radius:6px}
        .theme-name{text-align:center;font-size:12px;letter-spacing:8px;text-transform:uppercase;margin-bottom:8px;font-weight:700;color:#00ff41;opacity:0.8;text-shadow:0 0 20px #00ff41}
        h1{text-align:center;font-size:36px;margin-bottom:14px;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,#00ff41,#00ff41);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .top-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
        .lang-bar{display:flex;gap:5px;flex-wrap:wrap;flex:1.5;min-width:180px}
        .lang-btn{padding:5px 12px;border-radius:18px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);cursor:pointer;font-size:10px;font-weight:600;transition:.3s;border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:5px}
        .lang-btn:hover{background:rgba(255,255,255,0.08);color:#fff}
        .lang-btn.active{background:#00ff41;color:#000;border-color:#00ff41}
        .lang-btn .flag{font-size:14px}
        .controls{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:150px}
        .controls .box{flex:1;min-width:80px;padding:6px 12px;border-radius:28px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;min-height:34px}
        .controls .box .label{font-size:7px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.2);font-weight:700}
        .controls .box .dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,0.1);transition:.3s;flex-shrink:0}
        .controls .box .dot:hover{transform:scale(1.2);border-color:rgba(255,255,255,0.3)}
        .controls .box .dot.active{border-color:#00ff41;transform:scale(1.1);box-shadow:0 0 10px #00ff41}
        .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:14px;padding:16px;background:rgba(0,0,0,0.15);border-radius:18px;border:1px solid rgba(255,255,255,0.05);max-height:250px;overflow-y:auto}
        .theme-grid .tdot{width:100%;aspect-ratio:1;border-radius:14px;cursor:pointer;border:2px solid rgba(255,255,255,0.06);transition:.3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center}
        .theme-grid .tdot .icon{font-size:26px}
        .theme-grid .tdot .name{font-size:9px;font-weight:600;color:rgba(255,255,255,0.5)}
        .theme-grid .tdot:hover{transform:translateY(-3px) scale(1.05);border-color:rgba(255,255,255,0.2)}
        .theme-grid .tdot.active{border-color:#00ff41;transform:scale(1.04);box-shadow:0 0 20px rgba(0,255,65,0.2)}
        .pointer-box{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px;padding:8px 12px;background:rgba(0,0,0,0.15);border-radius:14px;border:1px solid rgba(255,255,255,0.05);align-items:center}
        .pointer-box .pbtn{padding:5px 11px;border-radius:9px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);cursor:pointer;font-size:10px;font-weight:600;transition:.3s;border:1px solid rgba(255,255,255,0.04)}
        .pointer-box .pbtn:hover{background:rgba(255,255,255,0.08);color:#fff}
        .pointer-box .pbtn.active{background:#00ff41;color:#000;border-color:#00ff41}
        .pointer-box .shape-btn{background:rgba(255,255,255,0.02);font-size:9px}
        .pointer-box .shape-btn.active{background:#00ff41;color:#000}
        .tabs{display:flex;gap:6px;margin-bottom:14px;background:rgba(0,0,0,0.15);padding:5px;border-radius:16px;border:1px solid rgba(255,255,255,0.04)}
        .tab{flex:1;padding:10px;border:none;background:transparent;color:rgba(255,255,255,0.2);border-radius:12px;cursor:pointer;font-size:13px;font-weight:700;transition:.3s}
        .tab:hover{color:rgba(255,255,255,0.5)}
        .tab.active{background:rgba(0,255,65,0.1);color:#00ff41}
        .page{display:none;animation:fadeIn .3s ease}
        .page.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        label{display:block;font-size:10px;color:rgba(255,255,255,0.2);margin-bottom:4px;margin-top:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
        textarea{width:100%;padding:14px 18px;border-radius:14px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);color:#fff;font-size:20px;resize:vertical;min-height:56px;transition:.3s;font-family:inherit}
        textarea:focus{outline:none;border-color:#00ff41}
        .color-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
        .color-row input[type=color]{width:42px;height:42px;border-radius:12px;cursor:pointer;background:none;border:2px solid rgba(255,255,255,0.06);padding:3px}
        .color-row input[type=text]{flex:1;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);color:#fff;font-size:14px;font-family:monospace}
        .color-row input[type=text]:focus{outline:none;border-color:#00ff41}
        .color-row button{padding:6px 12px;border:none;border-radius:10px;background:rgba(239,68,68,0.15);color:#ef4444;cursor:pointer;font-size:15px;transition:.3s}
        .color-row button:hover{background:rgba(239,68,68,0.25);transform:scale(1.05)}
        .btn{padding:10px 18px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;transition:.3s;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.04)}
        .btn:hover{background:rgba(255,255,255,0.08);color:#fff;transform:translateY(-2px)}
        .btn-success{background:rgba(0,255,65,0.12);color:#00ff41;border-color:rgba(0,255,65,0.08)}
        .btn-success:hover{background:rgba(0,255,65,0.2)}
        .btn-warning{background:rgba(245,158,11,0.12);color:#fbbf24;border-color:rgba(245,158,11,0.08)}
        .btn-warning:hover{background:rgba(245,158,11,0.2)}
        .btn-danger{background:rgba(239,68,68,0.12);color:#f87171;border-color:rgba(239,68,68,0.08)}
        .btn-danger:hover{background:rgba(239,68,68,0.2)}
        .btn-outline{background:transparent;border:1px solid #00ff41;color:#00ff41}
        .btn-outline:hover{background:#00ff41;color:#000}
        .btn-sm{padding:6px 12px;font-size:11px}
        .btn-group{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
        .btn-group .btn{flex:1;min-width:80px;text-align:center}
        .mode-selector{display:flex;gap:6px;margin:10px 0;background:rgba(0,0,0,0.15);padding:5px;border-radius:14px;border:1px solid rgba(255,255,255,0.04)}
        .mode-btn{flex:1;padding:9px;border:none;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;background:transparent;color:rgba(255,255,255,0.2);transition:.3s}
        .mode-btn.active{background:#00ff41;color:#000}
        .mode-btn:hover:not(.active){color:rgba(255,255,255,0.4)}
        .preview-box{border-radius:20px;padding:30px 20px;margin-top:16px;cursor:pointer;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;transition:.4s;background:rgba(0,0,0,0.15);border:2px solid rgba(255,255,255,0.06)}
        .preview-box:hover{transform:scale(1.01);border-color:#00ff41}
        .preview-text{font-size:32px;transition:.3s;word-break:break-word;color:#fff}
        .hint{color:rgba(255,255,255,0.1);font-size:11px;margin-top:8px}
        .copied-badge{background:rgba(0,255,65,0.15);color:#00ff41;padding:5px 14px;border-radius:20px;font-size:10px;font-weight:700;opacity:0;transition:.3s;position:absolute;top:12px;right:12px;border:1px solid rgba(0,255,65,0.1)}
        .copied-badge.show{opacity:1}
        .font-list{display:flex;flex-direction:column;gap:5px;margin-top:8px;max-height:280px;overflow-y:auto;padding-right:4px}
        .font-item{padding:10px 16px;background:rgba(255,255,255,0.02);border-radius:12px;border:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:.3s}
        .font-item:hover{background:rgba(255,255,255,0.06);transform:translateX(4px)}
        .font-item.active{border-color:#00ff41;background:rgba(0,255,65,0.05)}
        .font-item .fname{font-size:16px;color:#fff}
        .size-control{display:flex;align-items:center;gap:10px;margin-top:8px}
        .size-control input[type=range]{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,0.06);-webkit-appearance:none;accent-color:#00ff41}
        .size-control input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#00ff41;cursor:pointer;border:2px solid #000}
        .saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
        .saved-item{background:rgba(255,255,255,0.02);border-radius:14px;padding:12px;border:1px solid rgba(255,255,255,0.04);transition:.3s}
        .saved-item:hover{background:rgba(255,255,255,0.04);transform:translateY(-2px)}
        .saved-item .sp{min-height:36px;padding:8px;background:rgba(0,0,0,0.15);border-radius:10px;margin-bottom:6px;text-align:center;font-size:14px}
        .saved-item .si{font-size:9px;color:rgba(255,255,255,0.1);font-family:monospace;margin-bottom:6px;word-break:break-word}
        .saved-item .actions{display:flex;gap:4px}
        .saved-item .actions button{flex:1;padding:5px 8px;border:none;border-radius:8px;font-size:9px;font-weight:700;cursor:pointer;transition:.3s}
        .saved-item .actions .apply-btn{background:rgba(0,255,65,0.12);color:#00ff41}
        .saved-item .actions .apply-btn:hover{background:rgba(0,255,65,0.2)}
        .saved-item .actions .delete-btn{background:rgba(239,68,68,0.08);color:#f87171}
        .saved-item .actions .delete-btn:hover{background:rgba(239,68,68,0.15)}
        .empty-state{text-align:center;padding:24px;color:rgba(255,255,255,0.05);font-size:13px;grid-column:1/-1}
        .color-bar{display:flex;gap:2px;height:4px;border-radius:4px;overflow:hidden;margin-bottom:6px}
        .color-bar span{flex:1;height:100%}
        .shortcut-hint{text-align:center;font-size:9px;color:rgba(255,255,255,0.05);margin-top:10px;letter-spacing:2px}
        .stats{display:flex;gap:12px;justify-content:center;font-size:9px;color:rgba(255,255,255,0.05);margin-top:6px;flex-wrap:wrap}
        .stats span{background:rgba(255,255,255,0.02);padding:4px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.03)}
        .color-palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
        .color-palette .c{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid rgba(255,255,255,0.06);transition:.3s}
        .color-palette .c:hover{transform:scale(1.15);border-color:#00ff41}
        .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);padding:10px 24px;border-radius:14px;color:#00ff41;font-size:14px;font-weight:600;border:1px solid rgba(0,255,65,0.2);opacity:0;transition:.4s;z-index:999;pointer-events:none}
        .toast.show{opacity:1;bottom:50px}

        .pointer-crosshair{cursor:crosshair}
        .pointer-star{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><defs><filter id="st" x="-50%25" y="-50%25" width="200%25" height="200%25"><feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="%23000" flood-opacity="0.6"/></filter><radialGradient id="stg" cx="40%25" cy="30%25" r="75%25"><stop offset="0%25" stop-color="%23fffbe0"/><stop offset="45%25" stop-color="%23ffe066"/><stop offset="100%25" stop-color="%23d19b00"/></radialGradient></defs><g filter="url(%23st)"><polygon points="24,2 30,18 48,18 34,30 38,48 24,36 10,48 14,30 0,18 18,18" fill="url(%23stg)" stroke="%23fff" stroke-width="1.2"/></g></svg>') 24 24, auto}

<body>

<canvas id="particles-canvas"></canvas>

<div class="app" id="app">

    <div class="theme-name" id="themeName">✦ HACKER ✦</div>

    <h1>✨ NyxColor</h1>

        <button class="pbtn" onclick="setPointer('hacker')">💻</button>
        <button class="pbtn" onclick="setPointer('cyber')">🔮</button>
        <button class="pbtn" onclick="setPointer('star')">⭐</button>
        <button class="pbtn" onclick="setPointer('heart')">❤️</button>
        <button class="pbtn" onclick="setPointer('fire')">🔥</button>
        <button class="pbtn" onclick="setPointer('magic')">✨</button>
        <button class="pbtn" onclick="setPointer('crown')">👑</button>
        <button class="pbtn" onclick="setPointer('dragon')">🐉</button>
        <button class="pbtn" onclick="setPointer('ghost')">👻</button>
        <button class="pbtn" onclick="setPointer('skull')">💀</button>
        <button class="pbtn" onclick="setPointer('cod')">🎯</button>
    </div>

    <div class="pointer-box" style="margin-top:0;padding-top:4px;">
        <span style="font-size:9px;color:rgba(255,255,255,0.2);font-weight:700;letter-spacing:1px;margin-right:4px;">🧬 Shape:</span>
        <button class="pbtn shape-btn active" onclick="setParticleShape('auto')">Auto</button>
        <button class="pbtn shape-btn" onclick="setParticleShape('circle')">●</button>

    <div class="page" id="page-palette">

<script>
// ============================================================
// SOUND SYSTEM
// ============================================================
var audioCtx = null;
var noiseBufferCache = null;
var lastSoundTime = 0;

function getAudioCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function getNoiseBuffer(ctx){
    if(!noiseBufferCache){
        var size = ctx.sampleRate * 0.6;
        noiseBufferCache = ctx.createBuffer(1, size, ctx.sampleRate);
        var d = noiseBufferCache.getChannelData(0);
        for(var i=0;i<size;i++) d[i] = Math.random()*2-1;
    }
    return noiseBufferCache;
}

function noiseBurst(ctx,t,duration,freq,ftype,peak){
    var src = ctx.createBufferSource();
    src.buffer = getNoiseBuffer(ctx);
    var filt = ctx.createBiquadFilter();
    filt.type = ftype || 'bandpass';
    filt.frequency.value = freq || 1000;
    filt.Q.value = 1.1;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001,t);
    gain.gain.exponentialRampToValueAtTime(Math.max(peak,0.001),t+0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+duration);
    src.connect(filt);filt.connect(gain);gain.connect(ctx.destination);
    src.start(t);src.stop(t+duration+0.03);
}

function tone(ctx,t,freq,type,duration,peak,freqEnd){
    var osc = ctx.createOscillator();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq,t);
    if(freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1),t+duration);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001,t);
    gain.gain.exponentialRampToValueAtTime(Math.max(peak,0.001),t+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+duration);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(t);osc.stop(t+duration+0.03);
}

function playSound(type){
    try{
        var ctx = getAudioCtx();
        var t = ctx.currentTime;

        if(type === 'mace'){
            noiseBurst(ctx,t,0.07,280,'lowpass',0.55);
            tone(ctx,t,95,'sawtooth',0.32,0.4,38);
            tone(ctx,t+0.015,220,'square',0.14,0.18,90);
            tone(ctx,t+0.11,70,'sine',0.22,0.22,30);
        }else if(type === 'gun'){
            noiseBurst(ctx,t,0.07,2800,'highpass',0.45);
            tone(ctx,t,1300,'square',0.05,0.28,280);
            noiseBurst(ctx,t+0.05,0.12,700,'lowpass',0.08);
        }else if(type === 'sword'){
            noiseBurst(ctx,t,0.14,4200,'highpass',0.3);
            tone(ctx,t,1900,'sine',0.22,0.14,850);
            tone(ctx,t+0.02,2600,'triangle',0.15,0.08,1400);
        }else if(type === 'crosshair'){
            tone(ctx,t,1500,'sine',0.06,0.18);
            tone(ctx,t+0.03,2200,'sine',0.04,0.08);
        }else if(type === 'hacker'){

function pickShape(theme){
    if(manualShape) return manualShape;
    var list = theme.shapes || ['circle'];
    return list[Math.floor(Math.random()*list.length)];
}

function createParticles(count){
    particles=[];
    var theme = themeData.find(function(t){return t.id===currentTheme}) || themeData[0];
    particleColorRGB = hexToRgb(theme.particle);
    for(var i=0;i<count;i++){
        var shape = pickShape(theme);
        var text = '';
        if(shape==='text') text = shapeTexts.text[Math.floor(Math.random()*shapeTexts.text.length)];
        if(shape==='rune') text = shapeTexts.rune[Math.floor(Math.random()*shapeTexts.rune.length)];
        particles.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height,
            size:Math.random()*4+1.5,
            speedX:(Math.random()-0.5)*0.4,
            speedY: shape==='snowflake' ? (Math.random()*0.5+0.15) : (shape==='ember' ? -(Math.random()*0.6+0.2) : (Math.random()-0.5)*0.4),
            rot:Math.random()*Math.PI*2,
            rotSpeed:(Math.random()-0.5)*0.02,
            pulse:Math.random()*Math.PI*2,
            shape:shape,
            text:text
        });
    }
}

function drawShape(p, size, alpha){
    var rgb = particleColorRGB;
    var col = 'rgba('+rgb.r+','+rgb.g+','+rgb.b+','+alpha+')';
    var shape = p.shape;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.shadowColor = 'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.9)';
    ctx.shadowBlur = size*2+3;
    if(shape!=='text' && shape!=='rune' && shape!=='tracer') ctx.rotate(p.rot);

    if(shape==='square'){
        ctx.fillStyle=col;
        ctx.fillRect(-size,-size,size*2,size*2);
    }else if(shape==='star'){
        ctx.fillStyle=col;
        ctx.beginPath();
        for(var i=0;i<10;i++){
            var a1=(i*Math.PI)/5-Math.PI/2;
            var r1= i%2===0 ? size*1.7 : size*0.7;
            ctx.lineTo(Math.cos(a1)*r1, Math.sin(a1)*r1);
        }
        ctx.closePath();ctx.fill();
    }else if(shape==='leaf'){
        ctx.fillStyle=col;
        ctx.beginPath();
        ctx.ellipse(0,0,size*1.6,size*0.9,0,0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.15)';
        ctx.lineWidth=0.5;
        ctx.beginPath();ctx.moveTo(-size*1.4,0);ctx.lineTo(size*1.4,0);ctx.stroke();
    }else if(shape==='spark'){
        ctx.strokeStyle=col;
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(-size*1.5,0);ctx.lineTo(size*1.5,0);
        ctx.moveTo(0,-size*1.5);ctx.lineTo(0,size*1.5);
        ctx.stroke();
    }else if(shape==='tracer'){
        var ang = Math.atan2(p.speedY, p.speedX || 0.001);
        ctx.strokeStyle=col;
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(-Math.cos(ang)*size*2.5, -Math.sin(ang)*size*2.5);
        ctx.lineTo(Math.cos(ang)*size*1.2, Math.sin(ang)*size*1.2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(Math.cos(ang)*size*1.2, Math.sin(ang)*size*1.2, size*0.5, 0, Math.PI*2);
        ctx.fillStyle=col;ctx.fill();
    }else if(shape==='glitch'){
        ctx.fillStyle='rgba(255,0,90,0.5)';
        ctx.fillRect(-size-1,-size,size*2,size*0.6);
        ctx.fillStyle='rgba(0,255,255,0.5)';
        ctx.fillRect(-size+1,-size*0.3,size*2,size*0.6);
        ctx.fillStyle=col;
        ctx.fillRect(-size,-size*0.6,size*2,size*0.6);
    }else if(shape==='text' || shape==='rune'){
        ctx.font=(shape==='rune'?'bold ':'')+(size*2)+'px monospace';
        ctx.fillStyle=col;
        ctx.fillText(p.text,0,0);
    }else{
        ctx.fillStyle=col;
        ctx.beginPath();
        ctx.arc(0,0,size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.restore();
}

function initMatrixRain(){
    var colWidth = 16;
    var cols = Math.ceil(canvas.width/colWidth)+1;
    matrixCols = [];
    for(var i=0;i<cols;i++){
        matrixCols.push({y:Math.random()*-canvas.height, speed:2+Math.random()*3, len:5+Math.floor(Math.random()*14)});
    }
}
initMatrixRain();

function drawMatrixRain(){
    var rgb = particleColorRGB;
    ctx.fillStyle='rgba(2,8,2,0.12)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font='14px monospace';
    for(var i=0;i<matrixCols.length;i++){
        var c=matrixCols[i];
        var x=i*16;
        for(var k=0;k<c.len;k++){
            var yy=c.y-k*16;
            if(yy<0||yy>canvas.height) continue;
            var alpha = k===0?1:Math.max(0,0.85-(k/c.len));
            ctx.fillStyle= k===0 ? '#d6ffe0' : 'rgba('+rgb.r+','+rgb.g+','+rgb.b+','+alpha+')';
            ctx.fillText(matrixChars[Math.floor(Math.random()*matrixChars.length)], x, yy);
        }
        c.y+=c.speed;
        if(c.y-c.len*16>canvas.height){
            c.y=Math.random()*-300;
            c.speed=2+Math.random()*3;
            c.len=5+Math.floor(Math.random()*14);
        }
    }
}

function drawParticles(){
    var theme = themeData.find(function(t){return t.id===currentTheme}) || themeData[0];
    if(theme.rain && !manualShape){
        drawMatrixRain();
        requestAnimationFrame(drawParticles);
        return;
    }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var rgb = particleColorRGB;
    for(var i=0;i<particles.length;i++){
        var p=particles[i];
        p.x+=p.speedX;
        p.y+=p.speedY;
        p.rot+=p.rotSpeed;
        if(p.x<-10)p.x=canvas.width+10;
        if(p.x>canvas.width+10)p.x=-10;
        if(p.y<-10)p.y=canvas.height+10;
        if(p.y>canvas.height+10)p.y=-10;
        var dx=mouse.x-p.x,dy=mouse.y-p.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<160){var force=(160-dist)/160;p.x-=dx*force*0.025;p.y-=dy*force*0.025}
        p.pulse+=0.025;
        var size=p.size+Math.sin(p.pulse)*0.5;
        drawShape(p, size, 0.7);
    }
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.12)';
    ctx.lineWidth=0.8;
    for(var i=0;i<particles.length;i++){
        for(var j=i+1;j<particles.length;j++){
            var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);
            if(dist<120){
                var alpha=(1-(dist/120))*0.3;
                ctx.strokeStyle='rgba('+rgb.r+','+rgb.g+','+rgb.b+','+alpha+')';
                ctx.beginPath();
                ctx.moveTo(particles[i].x,particles[i].y);
                ctx.lineTo(particles[j].x,particles[j].y);
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(drawParticles);
}
drawParticles();

function hexToRgb(hex){
    var r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return r ? {r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)} : {r:255,g:255,b:255};
}

function rgbToHex(r,g,b){
    return "#"+[r,g,b].map(function(c){return Math.min(255,Math.max(0,Math.round(c))).toString(16).padStart(2,"0")}).join("");
}

function lerpColor(c1,c2,t){
    var a=hexToRgb(c1),b=hexToRgb(c2);
    return rgbToHex(a.r+(b.r-a.r)*t,a.g+(b.g-a.g)*t,a.b+(b.b-a.b)*t);
}

function getGradientColor(arr,ratio){
    if(arr.length===1)return arr[0];
    var total=arr.length-1,pos=ratio*total,idx=Math.min(Math.floor(pos),total-1);
    return lerpColor(arr[idx],arr[idx+1],pos-idx);
}

function showToast(msg){

}

function switchTab(tab){

function setMode(mode){

function renderColors(){
    var container=document.getElementById('colorList');
    var html='';
    for(var i=0;i<colors.length;i++){
        var c=colors[i];
        html+='<div class="color-row">';
        html+='<input type="color" value="'+c.color+'" onchange="updateColor('+c.id+', this.value)">';
        html+='<input type="text" value="'+c.color+'" oninput="updateColor('+c.id+', this.value)">';
        html+='<button onclick="removeColor('+c.id+')">✕</button>';
        html+='</div>';
    }
    container.innerHTML=html;
}

function addColor(){
    var last=colors.length>0?colors[colors.length-1].color:"#ffffff";
    colors.push({id:colorIdCounter++,color:last});
    renderColors();
    updatePreview();
}

function removeColor(id){
    if(colors.length<=2)return;
    colors=colors.filter(function(c){return c.id!==id});
    renderColors();
    updatePreview();
}

function updateColor(id,val){
    for(var i=0;i<colors.length;i++){if(colors[i].id===id){colors[i].color=val;break}}
    renderColors();
    updatePreview();
}

function resetColors(){
    colors=JSON.parse(JSON.stringify(defaultColors));
    colorIdCounter=colors.length+1;
    renderColors();
    updatePreview();
}

function reverseColors(){
    colors=colors.reverse();

}

function resetSize(){fontSize=28;document.getElementById('fontSizeSlider').value=28;document.getElementById('sizeLabel').textContent='28px';updatePreview()}

function updatePreview(){
    var text=document.getElementById('textInput').value||' ';
    var preview=document.getElementById('previewText');
    fontSize=parseInt(document.getElementById('fontSizeSlider').value);
    document.getElementById('sizeLabel').textContent=fontSize+'px';
    if(text.trim()===''){preview.textContent=' ';preview.style.fontFamily=selectedFont;preview.style.fontSize=fontSize+'px';preview.style.color='#fff';return}
    var chars=text.split('');
    var colorValues=colors.map(function(c){return c.color});
    var total=chars.length;
    var html='';
    if(currentMode==='gradient'){
        preview.style.background='linear-gradient(135deg,'+colorValues.join(',')+')';
        preview.style.webkitBackgroundClip='text';
        preview.style.webkitTextFillColor='transparent';
        preview.style.backgroundClip='text';
        preview.textContent=text;
        preview.style.fontFamily=selectedFont;
        preview.style.fontSize=fontSize+'px';
        return;
    }
    preview.style.background='transparent';
    preview.style.webkitTextFillColor='';
    preview.style.backgroundClip='';
    for(var i=0;i<total;i++){
        if(chars[i]===' '){html+=' ';continue}
        if(currentMode==='font'){html+='<span style="color:#ffffff">'+chars[i]+'</span>'}
        else{var ratio=total>1?i/(total-1):0;html+='<span style="color:'+getGradientColor(colorValues,ratio)+'">'+chars[i]+'</span>'}
    }
    preview.innerHTML=html;
    preview.style.fontFamily=selectedFont;
    preview.style.fontSize=fontSize+'px';
}

function saveColor(){
    var text=document.getElementById('textInput').value||' ';
    var colorData=colors.map(function(c){return c.color});
    savedItems.unshift({id:Date.now(),text:text,colors:colorData,font:selectedFont,fontName:selectedFontName,size:fontSize,mode:currentMode});
    localStorage.setItem('nyxcolor_saved',JSON.stringify(savedItems));
    document.getElementById('saveCount').textContent='💾 '+savedItems.length+' saved';
    renderSaved();
    showToast('Saved!');
    var btn=document.querySelector('.btn-success');
    var orig=btn.textContent;
    btn.textContent='✅ Saved!';
    setTimeout(function(){btn.textContent=orig},1200);
}

function copyCode(){
    var text=document.getElementById('textInput').value||' ';
    var colorData=colors.map(function(c){return c.color});
    var chars=text.split('');
    var total=chars.length;
    var code='';
    if(currentMode==='font'){code=text}
    else if(currentMode==='gradient'){code='background:linear-gradient(135deg,'+colorData.join(',')+');-webkit-background-clip:text;-webkit-text-fill-color:transparent;'}
    else{for(var i=0;i<total;i++){if(chars[i]===' '){code+=' ';continue}var ratio=total>1?i/(total-1):0;code+='&#'+getGradientColor(colorData,ratio).replace('#','')+chars[i]}}
    navigator.clipboard.writeText(code).then(function(){
        var badge=document.getElementById('copiedBadge');
        badge.classList.add('show');
        clearTimeout(copiedTimeout);
        copiedTimeout=setTimeout(function(){badge.classList.remove('show')},1800);
        copyCount++;
        localStorage.setItem('nyxcolor_copies',copyCount);
        document.getElementById('copyCount').textContent='📋 '+copyCount+' copies';
        showToast('Copied!');
    });
}

function renderSaved(){
    var grid=document.getElementById('savedGrid');
    if(savedItems.length===0){grid.innerHTML='<div class="empty-state">🎨 Nothing saved yet</div>';return}
    var html='';
    for(var idx=0;idx<savedItems.length;idx++){
        var item=savedItems[idx];
        var chars=(item.text||' ').split('');
        var colorsArray=item.colors||['#8b5cf6','#ec4899'];
        var total=chars.length;
        var size=item.size||28;
        var mode=item.mode||'font';
        var font=item.font||'Arial, sans-serif';
        var fontName=item.fontName||'Arial';
        var ph='';
        if(mode==='gradient'){ph=item.text}else{
            for(var i=0;i<total;i++){if(chars[i]===' '){ph+=' ';continue}if(mode==='font'){ph+='<span style="color:#ffffff">'+chars[i]+'</span>'}else{var ratio=total>1?i/(total-1):0;ph+='<span style="color:'+getGradientColor(colorsArray,ratio)+'">'+chars[i]+'</span>'}}
        }
        var bar=colorsArray.map(function(c){return'<span style="background:'+c+'"></span>'}).join('');
        var gradientStyle=(mode==='gradient')?'background:linear-gradient(135deg,'+colorsArray.join(',')+');-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;':'';
        html+='<div class="saved-item">';
        html+='<div class="sp" style="font-family:'+font+';font-size:'+size+'px;'+gradientStyle+'">'+ph+'</div>';
        html+='<div class="color-bar">'+bar+'</div>';
        html+='<div class="si">'+fontName+' • '+size+'px • '+mode+'</div>';
        html+='<div class="actions">';
        html+='<button class="apply-btn" onclick="applySaved('+idx+')">Apply</button>';
        html+='<button class="delete-btn" onclick="deleteSaved('+idx+')">✕</button>';
        html+='</div></div>';
    }
    grid.innerHTML=html;
}

function applySaved(idx){
    var item=savedItems[idx];
    document.getElementById('textInput').value=item.text||' ';
    colors=item.colors.map(function(c){return{id:colorIdCounter++,color:c}});
    renderColors();
    if(item.font){selectedFont=item.font;selectedFontName=item.fontName||'Arial';renderFonts()}
    if(item.size){fontSize=item.size;document.getElementById('fontSizeSlider').value=fontSize;document.getElementById('sizeLabel').textContent=fontSize+'px'}
    if(item.mode)setMode(item.mode);
    updatePreview();
    switchTab('home');
    showToast('Applied!');
}

function deleteSaved(idx){savedItems.splice(idx,1);localStorage.setItem('nyxcolor_saved',JSON.stringify(savedItems));renderSaved()}
function clearAll(){if(savedItems.length===0)return;if(confirm('Delete all saved?')){savedItems=[];localStorage.setItem('nyxcolor_saved',JSON.stringify(savedItems));renderSaved();showToast('Cleared!')}}

function updateOpacity(){

}

function convertHex(){
    var hex=document.getElementById('hexInput').value.trim();
    if(!hex.startsWith('#'))hex='#'+hex;
    var rgb=hexToRgb(hex);
    if(rgb&&rgb.r!==undefined){document.getElementById('rgbOutput').value='rgb('+rgb.r+','+rgb.g+','+rgb.b+')'}
}

function convertRgb(){
    var val=document.getElementById('rgbInput').value.trim();
    var parts=val.split(',').map(function(s){return parseInt(s.trim())});
    if(parts.length===3&&parts.every(function(n){return!isNaN(n)&&n>=0&&n<=255})){
        document.getElementById('hexOutput').value=rgbToHex(parts[0],parts[1],parts[2]);
    }
}

function uploadBg(e){
    var file=e.target.files[0];
    if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
        document.body.style.backgroundImage='url('+ev.target.result+')';
        document.body.style.backgroundSize='cover';
        document.body.style.backgroundPosition='center';
        document.body.style.backgroundAttachment='fixed';
        document.body.style.backgroundBlendMode='multiply';
        document.body.style.backgroundColor='rgba(0,0,0,0.4)';
        showToast('Background updated!');
    };
    reader.readAsDataURL(file);
}
